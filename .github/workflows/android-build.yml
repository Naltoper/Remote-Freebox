name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Expo Native Code
        run: npx expo prebuild --platform android --clean

      - name: Verify BootReceiver was generated
        run: |
          set -euo pipefail
          BR="android/app/src/main/java/com/naltoper/remotefreebox/BootReceiver.java"
          MF="android/app/src/main/AndroidManifest.xml"
          test -f "$BR" || { echo "Missing BootReceiver.java after prebuild"; exit 1; }
          grep -q 'com.naltoper.remotefreebox.BootReceiver' "$MF" \
            || { echo "BootReceiver missing from AndroidManifest.xml"; exit 1; }
          echo "BootReceiver OK"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-Freebox-APK
          path: android/app/build/outputs/apk/release/app-release.apk
